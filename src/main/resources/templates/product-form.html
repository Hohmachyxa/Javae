<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавление товара</title>
</head>
<body>
<h1>Добавление товара</h1>
<form th:action="@{/products/add}" th:object="${product}" method="post">
    <label>Название: <input type="text" th:field="*{name}"></label><br>
    <label>Цена: <input type="number" step="0.01" th:field="*{price}"></label><br>
    <label>Описание: <textarea th:field="*{description}"></textarea></label><br>
    <button type="submit">Сохранить</button>
</form>
</body>
</html>
